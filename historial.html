<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Historial - Sistema de Mantenimiento</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h3>Menú</h3>
            <a href="dashboard.html">Dashboard</a>
            <a href="equipos.html">Equipos</a>
            <a href="citas.html">Citas</a>
            <a href="historial.html" style="background: var(--secondary);">Historial</a>
            <a href="preventivo.html">Preventivo</a>
            <a href="reportes.html">Reportes</a>
            <a href="tickets.html">Tickets</a>
            <a href="usuarios.html">Usuarios</a>
            <a href="index.html" style="margin-top: 20px; border-top: 1px solid var(--secondary); padding-top: 15px;">Cerrar Sesión</a>
        </div>
        <div class="main">
            <div class="card">
                <h2>Historial de Mantenimiento</h2>

                <!-- Filtros -->
                <div style="margin: 15px 0; display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
                    <div>
                        <input type="search" id="buscarHistorial" placeholder="Buscar equipo, falla o diagnóstico" style="padding: 8px; border-radius: 5px; border: 1px solid #ccc; min-width: 240px;">
                    </div>
                    <div>
                        <label for="fechaDesde"><strong>Desde:</strong></label>
                        <input type="date" id="fechaDesde" style="margin-left: 5px; padding: 8px; border-radius: 5px; border: 1px solid #ccc;">
                    </div>
                    <div>
                        <label for="fechaHasta"><strong>Hasta:</strong></label>
                        <input type="date" id="fechaHasta" style="margin-left: 5px; padding: 8px; border-radius: 5px; border: 1px solid #ccc;">
                    </div>
                    <div>
                        <label for="filtroTipo"><strong>Tipo:</strong></label>
                        <select id="filtroTipo" style="margin-left: 5px; padding: 8px; border-radius: 5px; border: 1px solid #ccc;">
                            <option value="todos">Todos</option>
                            <option value="Desktop">Desktop</option>
                            <option value="Laptop">Laptop</option>
                            <option value="Servidor">Servidor</option>
                            <option value="Impresora">Impresora</option>
                        </select>
                    </div>
                    <button class="btn" onclick="filtrarHistorial()">Filtrar</button>
                    <button onclick="limpiarFiltro()">Limpiar</button>
                </div>

                <table>
                    <tr>
                        <th>Equipo</th>
                        <th>Tipo</th>
                        <th>Falla</th>
                        <th>Diagnóstico</th>
                        <th>Fecha</th>
                    </tr>
                    <tbody id="tablaHistorial">
                        <tr><td colspan="5">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { db } from "./firebase.js";
        import { requerirSesion, esc } from "./sesion.js";
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        let todosLosRegistros = [];

        async function cargarHistorial() {
            const tbody = document.getElementById("tablaHistorial");
            tbody.innerHTML = "";
            const snap = await getDocs(collection(db, "historial"));
            if (snap.empty) {
                tbody.innerHTML = "<tr><td colspan='5'>No hay registros en el historial.</td></tr>";
                return;
            }
            todosLosRegistros = [];
            snap.forEach(doc => {
                todosLosRegistros.push(doc.data());
            });
            renderTabla(todosLosRegistros);
        }

        function renderTabla(registros) {
            const tbody = document.getElementById("tablaHistorial");
            tbody.innerHTML = "";
            if (registros.length === 0) {
                tbody.innerHTML = "<tr><td colspan='5'>No hay registros con esos filtros.</td></tr>";
                return;
            }
            registros.forEach(d => {
                tbody.innerHTML += `<tr>
                    <td>${esc(d.equipo)}</td>
                    <td>${esc(d.tipo || "-")}</td>
                    <td>${esc(d.falla)}</td>
                    <td>${esc(d.diagnostico)}</td>
                    <td>${esc(d.fecha)}</td>
                </tr>`;
            });
        }

        window.filtrarHistorial = function() {
            const desde = document.getElementById("fechaDesde").value;
            const hasta = document.getElementById("fechaHasta").value;
            const tipo = document.getElementById("filtroTipo").value;
            const texto = document.getElementById("buscarHistorial").value.trim().toLowerCase();

            const filtrados = todosLosRegistros.filter(d => {
                if (desde && d.fecha < desde) return false;
                if (hasta && d.fecha > hasta) return false;
                if (tipo !== "todos" && d.tipo !== tipo) return false;
                if (texto && !`${d.equipo} ${d.falla} ${d.diagnostico}`.toLowerCase().includes(texto)) return false;
                return true;
            });

            renderTabla(filtrados);
        }

        window.limpiarFiltro = function() {
            document.getElementById("buscarHistorial").value = "";
            document.getElementById("fechaDesde").value = "";
            document.getElementById("fechaHasta").value = "";
            document.getElementById("filtroTipo").value = "todos";
            renderTabla(todosLosRegistros);
        }

        document.getElementById("buscarHistorial").addEventListener("input", filtrarHistorial);

        requerirSesion().then(cargarHistorial);
    </script>
</body>
</html>
