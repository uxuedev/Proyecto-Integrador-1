<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Equipos - Sistema de Mantenimiento</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h3>Menú</h3>
            <a href="dashboard.html">Dashboard</a>
            <a href="equipos.html" style="background: var(--secondary);">Equipos</a>
            <a href="citas.html">Citas</a>
            <a href="historial.html">Historial</a>
            <a href="preventivo.html">Preventivo</a>
            <a href="reportes.html">Reportes</a>
            <a href="index.html" style="margin-top: 20px; border-top: 1px solid var(--secondary); padding-top: 15px;">Cerrar Sesión</a>
        </div>
        <div class="main">
            <div class="card">
                <h2>Gestión de Equipos</h2>
                <button class="btn" onclick="mostrarFormulario()">Agregar Equipo</button>

                <div class="filtros-equipos">
                    <label for="filtroTipo">Filtrar por tipo:</label>
                    <select id="filtroTipo">
                        <option value="todos">Todos</option>
                        <option value="Desktop">Desktop</option>
                        <option value="Laptop">Laptop</option>
                        <option value="Servidor">Servidor</option>
                        <option value="Impresora">Impresora</option>
                    </select>
                </div>

                <!-- Formulario nuevo equipo -->
                <div id="formulario" style="display:none; margin: 15px 0; padding: 15px; background: #f5f5f5; border-radius: 8px;">
                    <h3>Nuevo Equipo</h3>
                    <input type="text" id="nombre" placeholder="Nombre del equipo" style="margin: 5px 0; padding: 8px; width: 100%;"><br>
                    <input type="text" id="serie" placeholder="Número de serie" style="margin: 5px 0; padding: 8px; width: 100%;"><br>
                    <select id="tipo" style="margin: 5px 0; padding: 8px; width: 100%;">
                        <option value="Desktop">Desktop</option>
                        <option value="Laptop">Laptop</option>
                        <option value="Servidor">Servidor</option>
                        <option value="Impresora">Impresora</option>
                    </select><br>
                    <select id="estado" style="margin: 5px 0; padding: 8px; width: 100%;" onchange="toggleCamposReparacion()">
                        <option value="Activo">Activo</option>
                        <option value="Inactivo">Inactivo</option>
                        <option value="En reparación">En reparación</option>
                    </select><br>
                    <div id="camposReparacion" style="display:none;">
                        <input type="text" id="falla" placeholder="Falla detectada" style="margin: 5px 0; padding: 8px; width: 100%;"><br>
                        <input type="text" id="diagnostico" placeholder="Diagnóstico" style="margin: 5px 0; padding: 8px; width: 100%;"><br>
                    </div>
                    <button class="btn" onclick="agregarEquipo()" style="margin-top: 10px;">Guardar</button>
                    <button onclick="ocultarFormulario()" style="margin-top: 10px; margin-left: 10px;">Cancelar</button>
                    <p id="mensajeEquipo" style="color: green;"></p>
                </div>

                <!-- Formulario editar equipo -->
                <div id="formEditar" style="display:none; margin: 15px 0; padding: 15px; background: #fff3cd; border-radius: 8px;">
                    <h3>Editar Equipo</h3>
                    <input type="text" id="editNombre" placeholder="Nombre del equipo" style="margin: 5px 0; padding: 8px; width: 100%;"><br>
                    <input type="text" id="editSerie" placeholder="Número de serie" style="margin: 5px 0; padding: 8px; width: 100%;"><br>
                    <select id="editTipo" style="margin: 5px 0; padding: 8px; width: 100%;">
                        <option value="Desktop">Desktop</option>
                        <option value="Laptop">Laptop</option>
                        <option value="Servidor">Servidor</option>
                        <option value="Impresora">Impresora</option>
                    </select><br>
                    <select id="editEstado" style="margin: 5px 0; padding: 8px; width: 100%;" onchange="toggleCamposEditReparacion()">
                        <option value="Activo">Activo</option>
                        <option value="Inactivo">Inactivo</option>
                        <option value="En reparación">En reparación</option>
                    </select><br>
                    <div id="camposEditReparacion" style="display:none;">
                        <input type="text" id="editFalla" placeholder="Falla detectada" style="margin: 5px 0; padding: 8px; width: 100%;"><br>
                        <input type="text" id="editDiagnostico" placeholder="Diagnóstico" style="margin: 5px 0; padding: 8px; width: 100%;"><br>
                    </div>
                    <button class="btn" onclick="guardarEdicion()" style="margin-top: 10px;">Guardar cambios</button>
                    <button onclick="cerrarEdicion()" style="margin-top: 10px; margin-left: 10px;">Cancelar</button>
                </div>

                <!-- Modal Detalles -->
                <div id="modalDetalles" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:999; justify-content:center; align-items:center;">
                    <div style="background:#fff; padding:25px; border-radius:10px; width:400px; max-width:90%;">
                        <h3>Detalles del Equipo</h3>
                        <p><strong>Falla:</strong> <span id="detFalla"></span></p>
                        <p><strong>Diagnóstico:</strong> <span id="detDiagnostico"></span></p>
                        <div style="text-align:right; margin-top:15px;">
                            <button onclick="cerrarDetalles()">Cerrar</button>
                        </div>
                    </div>
                </div>

                <table>
                    <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Serie</th>
                        <th>Tipo</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                    <tbody id="tablaEquipos">
                        <tr><td colspan="6">Cargando...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, doc, updateDoc, deleteDoc }
        from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDnEejftP3iYoTSAzYvDSdwHdYTEUIV8s4",
            authDomain: "proyecto-integrador-77c49.firebaseapp.com",
            projectId: "proyecto-integrador-77c49",
            storageBucket: "proyecto-integrador-77c49.firebasestorage.app",
            messagingSenderId: "1074040277954",
            appId: "1:1074040277954:web:26167a594d0c8159d6245b"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let equipoEditando = null;
        let estadoAnterior = null;

        window.toggleCamposReparacion = function() {
            const estado = document.getElementById("estado").value;
            document.getElementById("camposReparacion").style.display = estado === "En reparación" ? "block" : "none";
        }

        window.toggleCamposEditReparacion = function() {
            const estado = document.getElementById("editEstado").value;
            document.getElementById("camposEditReparacion").style.display = estado === "En reparación" ? "block" : "none";
        }

        async function cargarEquipos() {
            const tbody = document.getElementById("tablaEquipos");
            const filtroTipo = document.getElementById("filtroTipo").value;
            tbody.innerHTML = "";
            const snap = await getDocs(collection(db, "equipos"));
            if (snap.empty) {
                tbody.innerHTML = "<tr><td colspan='6'>No hay equipos registrados.</td></tr>";
                return;
            }
            let i = 1;
            let hayResultados = false;
            snap.forEach(docSnap => {
                const d = docSnap.data();
                if (filtroTipo !== "todos" && d.tipo !== filtroTipo) return;
                hayResultados = true;
                const falla = d.falla || "-";
                const diagnostico = d.diagnostico || "-";
                tbody.innerHTML += `<tr>
                    <td>${i++}</td>
                    <td>${d.nombre}</td>
                    <td>${d.serie || "-"}</td>
                    <td>${d.tipo}</td>
                    <td><span class="estado estado-${d.estado.replace(/\s+/g, '-').toLowerCase()}">${d.estado}</span></td>
                    <td>
                        <button onclick="verDetalles('${falla}', '${diagnostico}')" style="margin-right:4px;">Detalles</button>
                        <button onclick="abrirEdicion('${docSnap.id}', '${d.nombre}', '${d.serie || ''}', '${d.tipo}', '${d.estado}', '${falla}', '${diagnostico}')">Editar</button>
                        <button onclick="eliminarEquipo('${docSnap.id}')" style="margin-left: 5px; color: red;">Eliminar</button>
                    </td>
                </tr>`;
            });
            if (!hayResultados) {
                tbody.innerHTML = "<tr><td colspan='6'>No hay equipos con ese tipo.</td></tr>";
            }
        }

        window.verDetalles = function(falla, diagnostico) {
            document.getElementById("detFalla").textContent = falla;
            document.getElementById("detDiagnostico").textContent = diagnostico;
            document.getElementById("modalDetalles").style.display = "flex";
        }

        window.cerrarDetalles = function() {
            document.getElementById("modalDetalles").style.display = "none";
        }

        window.agregarEquipo = async function() {
            const nombre = document.getElementById("nombre").value.trim();
            const serie = document.getElementById("serie").value.trim();
            const tipo = document.getElementById("tipo").value;
            const estado = document.getElementById("estado").value;
            const falla = document.getElementById("falla").value.trim();
            const diagnostico = document.getElementById("diagnostico").value.trim();
            const mensaje = document.getElementById("mensajeEquipo");
            if (!nombre) {
                mensaje.style.color = "red";
                mensaje.textContent = "Por favor ingresa el nombre del equipo.";
                return;
            }
            await addDoc(collection(db, "equipos"), { nombre, serie, tipo, estado, falla, diagnostico });
            mensaje.style.color = "green";
            mensaje.textContent = "Equipo agregado exitosamente.";
            document.getElementById("nombre").value = "";
            document.getElementById("serie").value = "";
            document.getElementById("falla").value = "";
            document.getElementById("diagnostico").value = "";
            cargarEquipos();
        }

        window.abrirEdicion = function(id, nombre, serie, tipo, estado, falla, diagnostico) {
            equipoEditando = id;
            estadoAnterior = estado;
            document.getElementById("editNombre").value = nombre;
            document.getElementById("editSerie").value = serie;
            document.getElementById("editTipo").value = tipo;
            document.getElementById("editEstado").value = estado;
            document.getElementById("editFalla").value = falla !== "-" ? falla : "";
            document.getElementById("editDiagnostico").value = diagnostico !== "-" ? diagnostico : "";
            document.getElementById("camposEditReparacion").style.display = estado === "En reparación" ? "block" : "none";
            document.getElementById("formEditar").style.display = "block";
        }

        window.guardarEdicion = async function() {
            const nombre = document.getElementById("editNombre").value.trim();
            const serie = document.getElementById("editSerie").value.trim();
            const tipo = document.getElementById("editTipo").value;
            const estado = document.getElementById("editEstado").value;
            const falla = document.getElementById("editFalla").value.trim();
            const diagnostico = document.getElementById("editDiagnostico").value.trim();
            if (!nombre) return;

            await updateDoc(doc(db, "equipos", equipoEditando), { nombre, serie, tipo, estado, falla, diagnostico });

            if (estadoAnterior === "En reparación" && estado === "Activo") {
                const fecha = new Date().toISOString().split("T")[0];
                await addDoc(collection(db, "historial"), {
                    equipo: nombre,
                    falla: falla || "No especificada",
                    diagnostico: diagnostico || "No especificado",
                    fecha,
                    tipo
                });
            }

            cerrarEdicion();
            cargarEquipos();
        }

        window.eliminarEquipo = async function(id) {
            if (!confirm("¿Seguro que quieres eliminar este equipo?")) return;
            await deleteDoc(doc(db, "equipos", id));
            cargarEquipos();
        }

        window.cerrarEdicion = function() {
            document.getElementById("formEditar").style.display = "none";
        }

        window.mostrarFormulario = () => document.getElementById("formulario").style.display = "block";
        window.ocultarFormulario = () => document.getElementById("formulario").style.display = "none";
        document.getElementById("filtroTipo").addEventListener("change", cargarEquipos);

        cargarEquipos();
    </script>
</body>
</html>
