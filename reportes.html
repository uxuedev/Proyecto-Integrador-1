<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Reportes - Sistema de Mantenimiento</title>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h3>Menú</h3>
            <a href="dashboard.html">Dashboard</a>
            <a href="equipos.html">Equipos</a>
            <a href="citas.html">Citas</a>
            <a href="historial.html">Historial</a>
            <a href="preventivo.html">Preventivo</a>
            <a href="reportes.html" style="background: var(--secondary);">Reportes</a>
            <a href="tickets.html">Tickets</a>
            <a href="usuarios.html">Usuarios</a>
            <a href="index.html" style="margin-top: 20px; border-top: 1px solid var(--secondary); padding-top: 15px;">Cerrar Sesión</a>
        </div>
        <div class="main">
            <div class="card">
                <h2>Reportes</h2>
                <p>Selecciona el tipo de reporte y el formato de descarga.</p>

                <select id="tipoReporte" style="padding: 8px; margin: 10px 0; width: 100%;">
                    <option value="equipos">Equipos</option>
                    <option value="citas">Citas</option>
                    <option value="historial">Historial de Mantenimiento</option>
                    <option value="preventivo">Mantenimiento Preventivo</option>
                    <option value="tickets">Tickets de Soporte</option>
                </select>

                <div style="margin-top: 10px;">
                    <button class="btn" onclick="generarPDF()">Descargar PDF</button>
                    <button class="btn" onclick="generarExcel()" style="margin-left: 10px;">Descargar Excel</button>
                </div>

                <p id="mensajeReporte" style="margin-top: 10px; color: green;"></p>

                <!-- Vista previa -->
                <div id="vistaPrevia" style="margin-top: 20px; display:none;">
                    <h3 id="tituloPrevia"></h3>
                    <table id="tablaPrevia">
                        <thead id="theadPrevia"></thead>
                        <tbody id="tbodyPrevia"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { db } from "./firebase.js";
        import { requerirSesion, esc } from "./sesion.js";
        import { collection, getDocs } from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

        requerirSesion();

        const colecciones = {
            equipos: "equipos",
            citas: "citas",
            historial: "historial",
            preventivo: "mantenimiento_preventido",
            tickets: "tickets"
        };

        const columnas = {
            equipos: ["nombre", "tipo", "estado"],
            citas: ["fecha", "equipo_nombre", "estado"],
            historial: ["equipo", "falla", "diagnostico", "fecha"],
            preventivo: ["fecha", "equipo_nombre", "estado"],
            tickets: ["fecha_creacion", "equipo_nombre", "titulo", "prioridad", "estado", "tecnico_nombre"]
        };

        const encabezados = {
            equipos: ["Nombre", "Tipo", "Estado"],
            citas: ["Fecha", "Equipo", "Estado"],
            historial: ["Equipo", "Falla", "Diagnóstico", "Fecha"],
            preventivo: ["Fecha", "Equipo", "Estado"],
            tickets: ["Fecha", "Equipo", "Título", "Prioridad", "Estado", "Técnico"]
        };

        const titulosReporte = {
            equipos: "Equipos",
            citas: "Citas",
            historial: "Historial de Mantenimiento",
            preventivo: "Mantenimiento Preventivo",
            tickets: "Tickets de Soporte"
        };

        async function obtenerDatos() {
            const tipo = document.getElementById("tipoReporte").value;
            const nombreColeccion = colecciones[tipo];

            const snap = await getDocs(collection(db, nombreColeccion));

            const datos = [];
            snap.forEach(doc => datos.push(doc.data()));

            return {
                tipo,
                titulo: titulosReporte[tipo],
                datos,
                cols: columnas[tipo],
                heads: encabezados[tipo]
            };
        }

        function mostrarPrevia(tipo, datos, cols, heads) {
            const vistaPrevia = document.getElementById("vistaPrevia");
            document.getElementById("tituloPrevia").textContent = `Vista previa: ${tipo}`;
            document.getElementById("theadPrevia").innerHTML = `<tr>${heads.map(h => `<th>${h}</th>`).join("")}</tr>`;
            const tbody = document.getElementById("tbodyPrevia");
            tbody.innerHTML = "";
            if (datos.length === 0) {
                tbody.innerHTML = `<tr><td colspan="${heads.length}">Sin datos.</td></tr>`;
            } else {
                datos.forEach(d => {
                    tbody.innerHTML += `<tr>${cols.map(c => `<td>${esc(d[c] || "")}</td>`).join("")}</tr>`;
                });
            }
            vistaPrevia.style.display = "block";
        }

        window.generarPDF = async function() {
            const mensaje = document.getElementById("mensajeReporte");
            try {
                const { tipo, datos, cols, heads } = await obtenerDatos();
                mostrarPrevia(tipo, datos, cols, heads);

                const { jsPDF } = window.jspdf;
                const doc = new jsPDF();

                // Espacio para nombre/logo
                doc.setFontSize(18);
                doc.setTextColor(40, 40, 40);
                doc.text("TechCare", 105, 15, { align: "center" });

                // Subtítulo
                doc.setFontSize(12);
                doc.setTextColor(100, 100, 100);
                doc.text(`Reporte: ${tipo.toUpperCase()}`, 105, 23, { align: "center" });

                // Fecha
                const fecha = new Date().toLocaleDateString("es-MX");
                doc.setFontSize(9);
                doc.setTextColor(100, 100, 100);
                doc.text(`Generado el: ${fecha}`, 14, 30);

                // Línea separadora
                doc.setDrawColor(180, 180, 180);
                doc.line(14, 33, 196, 33);

                // Tabla
                doc.autoTable({
                    startY: 37,
                    head: [heads],
                    body: datos.map(d => cols.map(c => d[c] || "")),
                    styles: {
                        fontSize: 10,
                        cellPadding: 4,
                    },
                    headStyles: {
                        fillColor: [30, 90, 150],
                        textColor: 255,
                        fontStyle: "bold"
                    },
                    alternateRowStyles: {
                        fillColor: [240, 245, 255]
                    },
                    tableLineColor: [180, 180, 180],
                    tableLineWidth: 0.3
                });

                doc.save(`reporte_${tipo}.pdf`);
                mensaje.style.color = "green";
                mensaje.textContent = "PDF generado exitosamente.";
            } catch (e) {
                console.error(e);
                mensaje.style.color = "red";
                mensaje.textContent = "Error al generar el PDF.";
            }
        }

        window.generarExcel = async function() {
            const mensaje = document.getElementById("mensajeReporte");
            try {
                const { tipo, datos, cols, heads } = await obtenerDatos();
                mostrarPrevia(tipo, datos, cols, heads);

                const filas = [heads];
                datos.forEach(d => filas.push(cols.map(c => d[c] || "")));

                const ws = XLSX.utils.aoa_to_sheet(filas);
                const wb = XLSX.utils.book_new();
                XLSX.utils.book_append_sheet(wb, ws, tipo);
                XLSX.writeFile(wb, `reporte_${tipo}.xlsx`);

                mensaje.style.color = "green";
                mensaje.textContent = "Excel generado exitosamente.";
            } catch (e) {
                mensaje.style.color = "red";
                mensaje.textContent = "Error al generar el Excel.";
            }
        }
    </script>
</body>
</html>
