<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Preventivo - Sistema de Mantenimiento</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h3>Menú</h3>
            <a href="dashboard.html">Dashboard</a>
            <a href="equipos.html">Equipos</a>
            <a href="citas.html">Citas</a>
            <a href="historial.html">Historial</a>
            <a href="preventivo.html" style="background: var(--secondary);">Preventivo</a>
            <a href="reportes.html">Reportes</a>
            <a href="tickets.html">Tickets</a>
            <a href="usuarios.html">Usuarios</a>
            <a href="index.html" style="margin-top: 20px; border-top: 1px solid var(--secondary); padding-top: 15px;">Cerrar Sesión</a>
        </div>
        <div class="main">
            <div class="card">
                <h2>Mantenimiento Preventivo</h2>
                    <button class="btn" onclick="mostrarFormulario()">Nuevo Preventivo</button>

                    <div id="formulario" style="display:none; margin: 15px 0; padding: 15px; background: #f5f5f5; border-radius: 8px;">
                        <h3>Nuevo Preventivo</h3>

                        <input type="date" id="fecha" style="margin: 5px 0; padding: 8px; width: 100%;"><br>

                        <select id="equipo" style="margin: 5px 0; padding: 8px; width: 100%;">
                            <option value="">Selecciona un equipo</option>
                        </select><br>

                        <select id="periodicidad" class="select-periodicidad" style="margin: 5px 0; padding: 8px; width: 100%;"></select><br>

                        <select id="estado" style="margin: 5px 0; padding: 8px; width: 100%;">
                            <option value="Pendiente">Pendiente</option>
                            <option value="Completada">Completada</option>
                            <option value="Cancelada">Cancelada</option>
                        </select><br>

                        <button class="btn" onclick="agregarPreventivo()" style="margin-top: 10px;">Guardar</button>
                        <button onclick="ocultarFormulario()" style="margin-top: 10px; margin-left: 10px;">Cancelar</button>
                        <p id="mensajePreventivo" style="color: green;"></p>
                    </div>

                    <div id="formEditar" style="display:none; margin: 15px 0; padding: 15px; background: #fff3cd; border-radius: 8px;">
                        <h3>Editar Preventivo</h3>

                        <input type="date" id="editFecha" style="margin: 5px 0; padding: 8px; width: 100%;"><br>

                        <select id="editPeriodicidad" class="select-periodicidad" style="margin: 5px 0; padding: 8px; width: 100%;"></select><br>

                        <select id="editEstado" style="margin: 5px 0; padding: 8px; width: 100%;">
                            <option value="Pendiente">Pendiente</option>
                            <option value="Completada">Completada</option>
                            <option value="Cancelada">Cancelada</option>
                        </select><br>

                        <button class="btn" onclick="guardarEdicion()" style="margin-top: 10px;">Guardar cambios</button>
                        <button onclick="cerrarEdicion()" style="margin-top: 10px; margin-left: 10px;">Cancelar</button>
                    </div>

                    <p id="mensajeTabla" style="color: green;"></p>
                    <table>
                        <tr>
                            <th>Fecha</th>
                            <th>Equipo</th>
                            <th>Periodicidad</th>
                            <th>Próximo mantenimiento</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                        <tbody id="tablaPreventivo">
                            <tr><td colspan="6">Cargando...</td></tr>
                        </tbody>
                    </table>
            </div>
        </div>
    </div>

<script type="module">
    import { db } from "./firebase.js";
    import { requerirSesion, puede, esc, fechaLocal } from "./sesion.js";
    import { collection, getDocs, addDoc, doc, updateDoc, deleteDoc }
    from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    // Cada cuántos días se repite el mantenimiento (0 = una sola vez)
    const PERIODICIDADES = { 0: "Única vez", 30: "Mensual", 90: "Trimestral", 180: "Semestral", 365: "Anual" };

    let preventivos = [];
    let preventivoEditando = null;

    document.querySelectorAll(".select-periodicidad").forEach(s => {
        s.innerHTML = Object.entries(PERIODICIDADES)
            .map(([dias, texto]) => `<option value="${dias}">Periodicidad: ${texto}</option>`).join("");
    });

    function sumarDias(fechaISO, dias) {
        const f = new Date(fechaISO + "T00:00:00");
        f.setDate(f.getDate() + dias);
        return fechaLocal(f);
    }

    // Fecha del siguiente mantenimiento según la periodicidad
    const proximaFecha = p => Number(p.periodicidad_dias) > 0 ? sumarDias(p.fecha, Number(p.periodicidad_dias)) : "";

    async function cargarEquipos() {
        const select = document.getElementById("equipo");
        select.innerHTML = "<option value=''>Selecciona un equipo</option>";

        const snap = await getDocs(collection(db, "equipos"));

        snap.forEach(docSnap => {
            const data = docSnap.data();
            select.innerHTML += `<option value="${docSnap.id}">${esc(data.nombre)}</option>`;
        });
    }

async function cargarPreventivos() {
    const tbody = document.getElementById("tablaPreventivo");
    const snap = await getDocs(collection(db, "mantenimiento_preventido"));
    preventivos = snap.docs
        .map(d => ({ id: d.id, ...d.data() }))
        .sort((a, b) => String(a.fecha).localeCompare(String(b.fecha)));

    if (preventivos.length === 0) {
        tbody.innerHTML = "<tr><td colspan='6'>No hay preventivos registrados.</td></tr>";
        return;
    }

    const hoy = fechaLocal();
    tbody.innerHTML = preventivos.map(d => {
        // Un mantenimiento pendiente con fecha pasada se marca como vencido
        const vencido = d.estado === "Pendiente" && d.fecha < hoy;
        const estado = vencido
            ? `<span class="estado estado-vencido">Vencido</span>`
            : esc(d.estado);
        return `<tr>
            <td>${esc(d.fecha)}</td>
            <td>${esc(d.equipo_nombre)}</td>
            <td>${PERIODICIDADES[Number(d.periodicidad_dias) || 0]}</td>
            <td>${esc(proximaFecha(d) || "-")}</td>
            <td>${estado}</td>
            <td>
                <button onclick="abrirEdicion('${d.id}')">Editar</button>
                ${puede("preventivo.eliminar") ? `<button onclick="eliminarPreventivo('${d.id}')" style="margin-left: 5px; color: red;">Eliminar</button>` : ""}
            </td>
        </tr>`;
    }).join("");
}

window.agregarPreventivo = async function() {
    const fecha = document.getElementById("fecha").value;
    const select = document.getElementById("equipo");
    const equipoId = select.value;
    const equipoNombre = select.options[select.selectedIndex].text;
    const estado = document.getElementById("estado").value;
    const periodicidad_dias = Number(document.getElementById("periodicidad").value);
    const mensaje = document.getElementById("mensajePreventivo");

    if (!fecha || !equipoId) {
        mensaje.style.color = "red";
        mensaje.textContent = "Por favor completa todos los campos.";
        return;
    }

    await addDoc(collection(db, "mantenimiento_preventido"), {
        fecha,
        equipo_id: equipoId,
        equipo_nombre: equipoNombre,
        estado,
        periodicidad_dias
    });

    if (estado === "Pendiente") {
        await updateDoc(doc(db, "equipos", equipoId), {
            estado: "En reparación"
        });
    }

    const proxima = periodicidad_dias > 0 ? ` Próximo mantenimiento: ${sumarDias(fecha, periodicidad_dias)}.` : "";
    mensaje.style.color = "green";
    mensaje.textContent = "Preventivo agendado exitosamente." + proxima;
    document.getElementById("fecha").value = "";
    select.value = "";

    cargarPreventivos();
    }

    window.abrirEdicion = function(id) {
        const p = preventivos.find(x => x.id === id);
        preventivoEditando = p;

        document.getElementById("editFecha").value = p.fecha;
        document.getElementById("editEstado").value = p.estado;
        document.getElementById("editPeriodicidad").value = String(Number(p.periodicidad_dias) || 0);
        document.getElementById("formEditar").style.display = "block";
    }

    window.guardarEdicion = async function() {
        const p = preventivoEditando;
        const nuevaFecha = document.getElementById("editFecha").value;
        const nuevoEstado = document.getElementById("editEstado").value;
        const periodicidad_dias = Number(document.getElementById("editPeriodicidad").value);

        if (!nuevaFecha) return;

        await updateDoc(doc(db, "mantenimiento_preventido", p.id), {
            fecha: nuevaFecha,
            estado: nuevoEstado,
            periodicidad_dias
        });

        if (nuevoEstado === "Pendiente") {
            await updateDoc(doc(db, "equipos", p.equipo_id), {
                estado: "En reparación"
            });
        }

        // Al completar un mantenimiento periódico se programa automáticamente el siguiente
        const mensaje = document.getElementById("mensajeTabla");
        mensaje.textContent = "";
        if (nuevoEstado === "Completada" && p.estado !== "Completada" && periodicidad_dias > 0) {
            const siguiente = sumarDias(nuevaFecha, periodicidad_dias);
            await addDoc(collection(db, "mantenimiento_preventido"), {
                fecha: siguiente,
                equipo_id: p.equipo_id,
                equipo_nombre: p.equipo_nombre,
                estado: "Pendiente",
                periodicidad_dias
            });
            mensaje.textContent = `Mantenimiento completado. Se programó el siguiente para el ${siguiente}.`;
        }

        cerrarEdicion();
        cargarPreventivos();
    }

    window.eliminarPreventivo = async function(id) {
        if (!confirm("¿Seguro que quieres eliminar este preventivo?")) return;

        await deleteDoc(doc(db, "mantenimiento_preventido", id));
        cargarPreventivos();
    }

    window.cerrarEdicion = function() {
        document.getElementById("formEditar").style.display = "none";
    }

    window.mostrarFormulario = () => document.getElementById("formulario").style.display = "block";
    window.ocultarFormulario = () => document.getElementById("formulario").style.display = "none";

    requerirSesion().then(() => {
        cargarEquipos();
        cargarPreventivos();
    });
</script>
</body>
</html>
