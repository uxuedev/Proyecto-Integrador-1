<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Preventivo - Sistema de Mantenimiento</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h3>Menú</h3>
            <a href="dashboard.html">Dashboard</a>
            <a href="equipos.html">Equipos</a>
            <a href="citas.html">Citas</a>
            <a href="historial.html">Historial</a>
            <a href="preventivo.html" style="background: var(--secondary);">Preventivo</a>
            <a href="reportes.html">Reportes</a>
            <a href="tickets.html">Tickets</a>
            <a href="usuarios.html">Usuarios</a>
            <a href="index.html" style="margin-top: 20px; border-top: 1px solid var(--secondary); padding-top: 15px;">Cerrar Sesión</a>
        </div>
        <div class="main">
            <div class="card">
                <h2>Mantenimiento Preventivo</h2>
                    <button class="btn" onclick="mostrarFormulario()">Nuevo Preventivo</button>

                    <div id="formulario" style="display:none; margin: 15px 0; padding: 15px; background: #f5f5f5; border-radius: 8px;">
                        <h3>Nuevo Preventivo</h3>

                        <input type="date" id="fecha" style="margin: 5px 0; padding: 8px; width: 100%;"><br>

                        <select id="equipo" style="margin: 5px 0; padding: 8px; width: 100%;">
                            <option value="">Selecciona un equipo</option>
                        </select><br>

                        <select id="estado" style="margin: 5px 0; padding: 8px; width: 100%;">
                            <option value="Pendiente">Pendiente</option>
                            <option value="Completada">Completada</option>
                            <option value="Cancelada">Cancelada</option>
                        </select><br>

                        <button class="btn" onclick="agregarPreventivo()" style="margin-top: 10px;">Guardar</button>
                        <button onclick="ocultarFormulario()" style="margin-top: 10px; margin-left: 10px;">Cancelar</button>
                        <p id="mensajePreventivo" style="color: green;"></p>
                    </div>

                    <div id="formEditar" style="display:none; margin: 15px 0; padding: 15px; background: #fff3cd; border-radius: 8px;">
                        <h3>Editar Preventivo</h3>

                        <input type="date" id="editFecha" style="margin: 5px 0; padding: 8px; width: 100%;"><br>

                        <select id="editEstado" style="margin: 5px 0; padding: 8px; width: 100%;">
                            <option value="Pendiente">Pendiente</option>
                            <option value="Completada">Completada</option>
                            <option value="Cancelada">Cancelada</option>
                        </select><br>

                        <button class="btn" onclick="guardarEdicion()" style="margin-top: 10px;">Guardar cambios</button>
                        <button onclick="cerrarEdicion()" style="margin-top: 10px; margin-left: 10px;">Cancelar</button>
                    </div>

                    <table>
                        <tr>
                            <th>Fecha</th>
                            <th>Equipo</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                        <tbody id="tablaPreventivo">
                            <tr><td colspan="4">Cargando...</td></tr>
                        </tbody>
                    </table>
            </div>
        </div>
    </div>

<script type="module">
    import { db } from "./firebase.js";
    import { requerirSesion, puede, esc } from "./sesion.js";
    import { collection, getDocs, addDoc, doc, updateDoc, deleteDoc }
    from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

    let preventivoEditando = null;
    let equipoEditando = null;

    async function cargarEquipos() {
        const select = document.getElementById("equipo");
        select.innerHTML = "<option value=''>Selecciona un equipo</option>";

        const snap = await getDocs(collection(db, "equipos"));

        snap.forEach(docSnap => {
            const data = docSnap.data();
            select.innerHTML += `<option value="${docSnap.id}">${data.nombre}</option>`;
        });
    }

async function cargarPreventivos() {
    const tbody = document.getElementById("tablaPreventivo");
    tbody.innerHTML = "";

    const snap = await getDocs(collection(db, "mantenimiento_preventido"));

    if (snap.empty) {
        tbody.innerHTML = "<tr><td colspan='4'>No hay preventivos registrados.</td></tr>";
        return;
    }

    snap.forEach(docSnap => {
        const d = docSnap.data();

        tbody.innerHTML += `<tr>
            <td>${esc(d.fecha)}</td>
            <td>${esc(d.equipo_nombre)}</td>
            <td>${esc(d.estado)}</td>
            <td>
                <button onclick="abrirEdicion('${docSnap.id}', '${d.fecha}', '${d.estado}', '${d.equipo_id}')">Editar</button>
                ${puede("preventivo.eliminar") ? `<button onclick="eliminarPreventivo('${docSnap.id}')" style="margin-left: 5px; color: red;">Eliminar</button>` : ""}
            </td>
        </tr>`;
    });
}

window.agregarPreventivo = async function() {
    const fecha = document.getElementById("fecha").value;
    const select = document.getElementById("equipo");
    const equipoId = select.value;
    const equipoNombre = select.options[select.selectedIndex].text;
    const estado = document.getElementById("estado").value;
    const mensaje = document.getElementById("mensajePreventivo");

    if (!fecha || !equipoId) {
        mensaje.style.color = "red";
        mensaje.textContent = "Por favor completa todos los campos.";
        return;
    }

    await addDoc(collection(db, "mantenimiento_preventido"), {
        fecha,
        equipo_id: equipoId,
        equipo_nombre: equipoNombre,
        estado
    });

    if (estado === "Pendiente") {
        await updateDoc(doc(db, "equipos", equipoId), {
            estado: "En reparación"
        });
    }

    mensaje.style.color = "green";
    mensaje.textContent = "Preventivo agendado exitosamente.";
    document.getElementById("fecha").value = "";
    select.value = "";

    cargarPreventivos();
    }

    window.abrirEdicion = function(id, fecha, estado, equipoId) {
        preventivoEditando = id;
        equipoEditando = equipoId;

        document.getElementById("editFecha").value = fecha;
        document.getElementById("editEstado").value = estado;
        document.getElementById("formEditar").style.display = "block";
    }

    window.guardarEdicion = async function() {
        const nuevaFecha = document.getElementById("editFecha").value;
        const nuevoEstado = document.getElementById("editEstado").value;

        if (!nuevaFecha) return;

        await updateDoc(doc(db, "mantenimiento_preventido", preventivoEditando), {
            fecha: nuevaFecha,
            estado: nuevoEstado
        });

        if (nuevoEstado === "Pendiente") {
            await updateDoc(doc(db, "equipos", equipoEditando), {
                estado: "En reparación"
            });
        }

        cerrarEdicion();
        cargarPreventivos();
    }

    window.eliminarPreventivo = async function(id) {
        if (!confirm("¿Seguro que quieres eliminar este preventivo?")) return;

        await deleteDoc(doc(db, "mantenimiento_preventido", id));
        cargarPreventivos();
    }

    window.cerrarEdicion = function() {
        document.getElementById("formEditar").style.display = "none";
    }

    window.mostrarFormulario = () => document.getElementById("formulario").style.display = "block";
    window.ocultarFormulario = () => document.getElementById("formulario").style.display = "none";

    requerirSesion().then(() => {
        cargarEquipos();
        cargarPreventivos();
    });
</script>
</body>
</html>
