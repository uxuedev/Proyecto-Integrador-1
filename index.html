<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Sistema de Mantenimiento</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container"> 
        <div class="login-box">

                        <div class="brand">
                <div class="brand-icon">
                    <!-- Ícono de monitor -->
                    <svg viewBox="0 0 24 24">
                        <rect x="2" y="3" width="20" height="14" rx="2"/>
                        <line x1="8" y1="21" x2="16" y2="21"/>
                        <line x1="12" y1="17" x2="12" y2="21"/>
                    </svg>
                </div>
                <div class="brand-name">Tech<span>Care</span></div>
                <div class="brand-sub">Gestión de mantenimiento de equipos</div>
            </div>

            <h2>Iniciar Sesión</h2>

            <input type="email" id="usuario" placeholder="Correo">
            <input type="password" id="contrasena" placeholder="Contraseña">

            <button onclick="login()">Entrar</button>

            <p id="error" style="color:red;"></p>
        </div>
    </div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, signInWithEmailAndPassword } 
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import { getFirestore, doc, getDoc }
from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// 🔴 PEGA TU CONFIG REAL AQUÍ - YA ESTA PEGADA
const firebaseConfig = {
    apiKey: "AIzaSyDnEejftP3iYoTSAzYvDSdwHdYTEUIV8s4",
    authDomain: "proyecto-integrador-77c49.firebaseapp.com",
    projectId: "proyecto-integrador-77c49",
    storageBucket: "proyecto-integrador-77c49.firebasestorage.app",
    messagingSenderId: "1074040277954",
    appId: "1:1074040277954:web:26167a594d0c8159d6245b"
  };

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.login = async function() {

    const email = document.getElementById("usuario").value;
    const password = document.getElementById("contrasena").value;
    const errorText = document.getElementById("error");

    try {
        await signInWithEmailAndPassword(auth, email, password);

        window.location.href = "dashboard.html";

    } catch (error) {
        errorText.textContent = "Usuario o contraseña incorrectos";
    }
}
</script>

</body> 
</html>
