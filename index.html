<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Iniciar Sesión - Sistema de Mantenimiento</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="login-container"> 
        <div class="login-box">

                        <div class="brand">
                <div class="brand-icon">
                    <!-- Ícono de monitor -->
                    <svg viewBox="0 0 24 24">
                        <rect x="2" y="3" width="20" height="14" rx="2"/>
                        <line x1="8" y1="21" x2="16" y2="21"/>
                        <line x1="12" y1="17" x2="12" y2="21"/>
                    </svg>
                </div>
                <div class="brand-name">Tech<span>Care</span></div>
                <div class="brand-sub">Gestión de mantenimiento de equipos</div>
            </div>

            <div id="formLogin">
                <h2>Iniciar Sesión</h2>

                <input type="email" id="usuario" placeholder="Correo">
                <input type="password" id="contrasena" placeholder="Contraseña">

                <button onclick="login()">Entrar</button>

                <p class="cambiar-modo">¿No tienes cuenta? <a href="#" onclick="mostrarRegistro(true)">Regístrate</a></p>
            </div>

            <!-- Registro: toda cuenta nueva entra con rol Usuario; el administrador lo cambia después -->
            <div id="formRegistro" style="display:none;">
                <h2>Crear cuenta</h2>

                <input type="text" id="regNombre" placeholder="Nombre completo">
                <input type="email" id="regCorreo" placeholder="Correo">
                <input type="password" id="regContrasena" placeholder="Contraseña (mínimo 6 caracteres)">
                <input type="password" id="regConfirmar" placeholder="Confirmar contraseña">

                <button onclick="registrar()">Crear cuenta</button>

                <p class="cambiar-modo">¿Ya tienes cuenta? <a href="#" onclick="mostrarRegistro(false)">Inicia sesión</a></p>
            </div>

            <p id="error" style="color:red;"></p>
        </div>
    </div>

<script type="module">
import { auth, db } from "./firebase.js";
import { signInWithEmailAndPassword, createUserWithEmailAndPassword }
from "https://www.gstatic.com/firebasejs/11.0.0/firebase-auth.js";
import { doc, setDoc }
from "https://www.gstatic.com/firebasejs/11.0.0/firebase-firestore.js";

window.mostrarRegistro = function(registro) {
    document.getElementById("formLogin").style.display = registro ? "none" : "block";
    document.getElementById("formRegistro").style.display = registro ? "block" : "none";
    document.getElementById("error").textContent = "";
}

const erroresRegistro = {
    "auth/email-already-in-use": "Ese correo ya está registrado.",
    "auth/invalid-email": "El correo no es válido.",
    "auth/weak-password": "La contraseña debe tener al menos 6 caracteres.",
    "auth/operation-not-allowed": "El registro está deshabilitado en Firebase."
};

window.registrar = async function() {
    const nombre = document.getElementById("regNombre").value.trim();
    const email = document.getElementById("regCorreo").value.trim();
    const password = document.getElementById("regContrasena").value;
    const confirmar = document.getElementById("regConfirmar").value;
    const errorText = document.getElementById("error");

    if (!nombre || !email || !password) {
        errorText.textContent = "Completa todos los campos.";
        return;
    }
    if (password !== confirmar) {
        errorText.textContent = "Las contraseñas no coinciden.";
        return;
    }

    try {
        const { user } = await createUserWithEmailAndPassword(auth, email, password);
        await setDoc(doc(db, "usuarios", user.uid), { nombre, email, rol: "usuario" });

        window.location.href = "dashboard.html";

    } catch (error) {
        console.error(error);
        errorText.textContent = erroresRegistro[error.code] || "No se pudo crear la cuenta.";
    }
}

window.login = async function() {

    const email = document.getElementById("usuario").value;
    const password = document.getElementById("contrasena").value;
    const errorText = document.getElementById("error");

    try {
        await signInWithEmailAndPassword(auth, email, password);

        window.location.href = "dashboard.html";

    } catch (error) {
        errorText.textContent = "Usuario o contraseña incorrectos";
    }
}
</script>

</body> 
</html>
